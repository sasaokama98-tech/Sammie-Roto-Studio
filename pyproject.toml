[project]
name = "Sammie-Roto-Studio"
version = "2.4.0+studio.2"
description = "VFX-focused SAM tracking and high-quality matting application"
requires-python = ">=3.11"

dependencies = [
    "opencv-python~=4.14",
    "PySide6-essentials==6.9.3",
    "av~=18.1",
    "requests~=2.34",
    "tqdm~=4.70",
    "OpenEXR~=3.4",
    "diffusers~=0.39",
    "einops~=0.8",
]

[project.optional-dependencies]
cpu   = ["torch==2.11.0", "torchvision==0.26.0", "accelerate~=1.14"]
sam31 = [
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
    "pycocotools>=2.0.10",
    "setuptools>=61,<81",
    "triton-windows>=3.6,<3.7 ; sys_platform == 'win32'",
]
vitmatte = [
    "transformers>=4.57,<6",
    "safetensors>=0.4",
]
mematte = [
    "timm>=0.9,<2",
]
cu126 = ["torch==2.11.0", "torchvision==0.26.0", "accelerate~=1.14"]
cu130 = ["torch==2.11.0", "torchvision==0.26.0", "accelerate~=1.14"]
rocm  = [
    "torch==2.11.0 ; sys_platform == 'linux'",
    "torchvision==0.26.0 ; sys_platform == 'linux'",
    "triton-rocm==3.6.0 ; sys_platform == 'linux'",
    "accelerate~=1.14"
]
xpu   = ["torch==2.11.0", "torchvision==0.26.0", "triton-xpu==3.7.0", "accelerate~=1.14"]

[tool.uv]
package = false
# SAM3 currently declares numpy<2 while OpenCV 4.12+ requires numpy>=2.
# SAM3's inference code is pure Python/torch; retain Sammie's tested OpenCV
# stack and validate this integration override with the SAM 3.1 GPU smoke test.
override-dependencies = ["numpy>=2,<2.3"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu130" },
    { extra = "rocm" },
    { extra = "xpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-rocm",  extra = "rocm", marker = "sys_platform == 'linux'" },
  { index = "pytorch-xpu",   extra = "xpu" },
  { index = "pytorch-cpu",   extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-rocm",  extra = "rocm", marker = "sys_platform == 'linux'"  },
  { index = "pytorch-xpu",   extra = "xpu" },
  { index = "pytorch-cpu",   extra = "cpu" },
]
triton-rocm = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
triton-xpu = [
  { index = "pytorch-xpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
